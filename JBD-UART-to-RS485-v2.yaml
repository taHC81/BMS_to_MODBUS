esphome:
  name: jbd-uart-rs485

esp32:
  variant: ESP32C3
  board: esp32-c3-devkitm-1
  framework:
    type: arduino
    version: latest

external_components:
  - source: github://syssi/esphome-jbd-bms@main
    refresh: 0s
  - source: github://aj-nagrom/esphome-modbus-server@master
    refresh: 0s

logger:

uart:
  - id: uart_0          # JBD BMS UART
    baud_rate: 9600
    tx_pin: GPIO5
    rx_pin: GPIO6
  - id: modbus_0
    baud_rate: 19200
    tx_pin: GPIO21    # DI
    rx_pin: GPIO20    # RO
    debug:
      direction: BOTH

jbd_bms:
  uart_id: uart_0
  update_interval: 2s
  rx_timeout: 200ms

modbus_server:
  - id: modbuserver
    uart_id: modbus_0
    re_pin:
      number: GPIO10
      allow_other_uses: true
    de_pin:
      number: GPIO10
      allow_other_uses: true
    address: 8                  # change modbus device ID accoring to your need
    holding_registers:
      - start_address: 0
        number: 1
        on_read: 'return id(bms2_soc).state;'
      - start_address: 1
        number: 1
        on_read: 'return id(bms2_total_voltage).state * 100;'
      - start_address: 2
        number: 1
        on_read: |
         int cur = id(bms2_current).state * 100;
         if (cur < 0) {
           cur = (32768 + cur) | 0x8000;
         }
         return cur;
      - start_address: 3
        number: 1
        on_read: |
         int pow = id(bms2_power).state * 10;
         if (pow < 0) {
           pow = (32768 + pow) | 0x8000;
         }
         return pow;

      - start_address: 4
        number: 1
        on_read: 'return id(bms2_cycles).state;'

      - start_address: 5
        number: 1
        on_read: 'return id(bms2_cell_avg_voltage).state * 1000;'
      - start_address: 6
        number: 1
        on_read: 'return id(bms2_cell_min_voltage).state * 1000;'
      - start_address: 7
        number: 1
        on_read: 'return id(bms2_cell_max_voltage).state * 1000;'
      - start_address: 8
        number: 1
        on_read: 'return id(bms2_cell_delta_voltage).state * 1000;'
      - start_address: 9
        number: 1
        on_read: 'return id(bms2_cell_min_number).state;'
      - start_address: 10
        number: 1
        on_read: 'return id(bms2_cell_max_number).state;'

      - start_address: 11
        number: 1
        on_read: 'return id(bms2_temp).state * 10;'
      - start_address: 12
        number: 1
        on_read: 'return id(bms2_temp_cells1).state * 10;'
      - start_address: 13
        number: 1
        on_read: 'return id(bms2_temp_cells2).state * 10;'

      - start_address: 14
        number: 1
        on_read: 'return id(bms2_cell01_voltage).state * 1000;'
      - start_address: 15
        number: 1
        on_read: 'return id(bms2_cell02_voltage).state * 1000;'
      - start_address: 16
        number: 1
        on_read: 'return id(bms2_cell03_voltage).state * 1000;'
      - start_address: 17
        number: 1
        on_read: 'return id(bms2_cell04_voltage).state * 1000;'
      - start_address: 18
        number: 1
        on_read: 'return id(bms2_cell05_voltage).state * 1000;'
      - start_address: 19
        number: 1
        on_read: 'return id(bms2_cell06_voltage).state * 1000;'
      - start_address: 20
        number: 1
        on_read: 'return id(bms2_cell07_voltage).state * 1000;'
      - start_address: 21
        number: 1
        on_read: 'return id(bms2_cell08_voltage).state * 1000;'
      - start_address: 22
        number: 1
        on_read: 'return id(bms2_cell09_voltage).state * 1000;'
      - start_address: 23
        number: 1
        on_read: 'return id(bms2_cell10_voltage).state * 1000;'
      - start_address: 24
        number: 1
        on_read: 'return id(bms2_cell11_voltage).state * 1000;'
      - start_address: 25
        number: 1
        on_read: 'return id(bms2_cell12_voltage).state * 1000;'
      - start_address: 26
        number: 1
        on_read: 'return id(bms2_cell13_voltage).state * 1000;'
      - start_address: 27
        number: 1
        on_read: 'return id(bms2_cell14_voltage).state * 1000;'
      - start_address: 28
        number: 1
        on_read: 'return id(bms2_cell15_voltage).state * 1000;'
      - start_address: 29
        number: 1
        on_read: 'return id(bms2_cell16_voltage).state * 1000;'

      - start_address: 30
        number: 1
        on_read: 'return id(bms2_cap_nominal).state * 100;'
      - start_address: 31
        number: 1
        on_read: 'return id(bms2_cap_remaining).state * 100;'

      - start_address: 32
        number: 1
        on_read: 'return id(bms2_battery_sw_balancing).state;'
      - start_address: 33
        number: 1
        on_read: 'return id(bms2_battery_sw_charge).state;'
      - start_address: 34
        number: 1
        on_read: 'return id(bms2_battery_sw_discharge).state;'

      - start_address: 35
        number: 1
        on_read: 'return id(bms2_bitmask_balancer).state;'
        # value_type: U_DWORD
      - start_address: 36
        number: 1
        on_read: 'return id(bms2_bitmask_op).state;'
      - start_address: 37
        number: 1
        on_read: 'return id(bms2_bitmask_error).state;'
      - start_address: 38
        number: 1
        on_read: 'return id(bms2_online).state;'
      - start_address: 39
        number: 1
        on_read: 'return id(bms2_sw_version).state;'

      - start_address: 40
        # value_type: U_DWORD
        number: 1
        on_read: |-
          id(onboard_led).turn_on();
          return id(esp_uptime).state / 60;

      - start_address: 41
        number: 1
        on_write: |
          if(value)
            id(bms2_battery_sw_charge)->turn_on();
          else
            id(bms2_battery_sw_charge)->turn_off();
          return value;
        on_read: |
          return id(bms2_battery_sw_charge)->state ? 1 : 0;
      - start_address: 42
        number: 1
        on_write: |
          if(value)
            id(bms2_battery_sw_discharge)->turn_on();
          else
            id(bms2_battery_sw_discharge)->turn_off();
          return value;
        on_read: |
          return id(bms2_battery_sw_discharge)->state ? 1 : 0;

switch:
  - platform: gpio
    id: onboard_led
    pin:
      number: GPIO8
      mode: output
      inverted: true
      ignore_strapping_warning: true
    on_turn_on:
      - delay: 0.05s
      - switch.turn_off: onboard_led

  - platform: jbd_bms
    charging:
      name: "BMS2 charging switch"
      id: bms2_battery_sw_charge
    discharging:
      name: "BMS2 discharging switch"
      id: bms2_battery_sw_discharge

binary_sensor:
  - platform: jbd_bms
    balancing:
      name: "BMS2 balancing"
      id: bms2_battery_sw_balancing
    charging:
      name: "BMS2 charging"
      id: bms2_battery_charging
    discharging:
      name: "BMS2 discharging"
      id: bms2_battery_discharging
    online_status:
      name: "BMS2 online status"
      id: bms2_online

# ------------------------------------ sensors ------------------------------------

sensor:
  - platform: uptime
    id: esp_uptime
    name: "ESP jbd-uart-rs485 uptime"
    update_interval: 60s

  - platform: jbd_bms
    battery_strings:
      name: "BMS2 battery strings"
      id: bms2_battery_strings
    current:
      name: "BMS2 current"
      id: bms2_current
    power:
      name: "BMS2 power"
      id: bms2_power
    charging_power:
      name: "BMS2 charging power"
      id: bms2_charging_power
    discharging_power:
      name: "BMS2 discharging power"
      id: bms2_discharging_power
    state_of_charge:
      name: "BMS2 state of charge"
      id: bms2_soc
    nominal_capacity:
      name: "BMS2 nominal capacity"
      id: bms2_cap_nominal
    charging_cycles:
      name: "BMS2 charging cycles"
      id: bms2_cycles
    capacity_remaining:
